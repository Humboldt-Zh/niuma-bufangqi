name: Prepare draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.1'
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate release identity
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          . ./scripts/Resolve-Dotnet.ps1
          $version = Get-NiumaVersion
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$' -or $env:RELEASE_TAG -ne "v$version") {
            throw 'Tag must match the release version.'
          }
          $tagCommit = git rev-parse --verify "refs/tags/$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:RELEASE_COMMIT) {
            throw 'Create the release tag on this exact commit before preparing its draft.'
          }
      - name: Test and package
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
        run: ./scripts/publish.ps1 -Runtime win-x64
      - name: Create a draft for maintainer review
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $files = @(Get-ChildItem -LiteralPath artifacts -File | Where-Object { $_.Name -match '\.(zip|sha256)$' } | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @files --draft --verify-tag --title "牛马不放器 $env:RELEASE_TAG" --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
