<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">揉皱的便签纸</title>
  <desc id="desc">一张揉成不规则纸团的暖白便签，有翘起的纸边、细碎折痕和断开的字迹。</desc>
  <defs>
    <path id="paper" d="m70 19 17 5 17-8 14 8 15-1 11 15 16 6 3 18 12 13-3 19 6 15-10 15 2 18-16 10-8 18-20-1-15 11-19-7-19 3-12-13-19-3-3-18-12-13 5-19-6-17 10-16 1-18 18-7 9-17Z"/>
    <clipPath id="paper-clip"><use href="#paper"/></clipPath>
    <linearGradient id="paper-base" x1="62" y1="29" x2="145" y2="172" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffef7"/>
      <stop offset="1" stop-color="#e5dfd1"/>
    </linearGradient>
    <linearGradient id="long-fold" x1="100" y1="60" x2="112" y2="91" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c0b7a5"/>
      <stop offset=".17" stop-color="#e0d9cb"/>
      <stop offset="1" stop-color="#f8f5e9"/>
    </linearGradient>
    <pattern id="fibers" width="19" height="17" patternUnits="userSpaceOnUse">
      <path d="m2 4 2 1m9 6 3-1m-8 5 1 1" stroke="#a79f8d" stroke-opacity=".13" stroke-width=".45"/>
    </pattern>
  </defs>

  <use href="#paper" fill="url(#paper-base)"/>
  <g clip-path="url(#paper-clip)">
    <!-- Thin folded-over edges distinguish paper from a solid, faceted object. -->
    <path d="m56 28 15-9 16 5-12 14-18 10-4-13Z" fill="#fdfbf0"/>
    <path d="m87 24 17-8-4 19-25 3Z" fill="#e2dccf"/>
    <path d="m104 16 14 8 15-1-4 20-29-8Z" fill="#fffef8"/>
    <path d="m133 23 11 15 16 6-21 9-10-10Z" fill="#e1dacd"/>
    <path d="m160 44 3 18 12 13-21 6-15-28Z" fill="#f5f1e4"/>
    <path d="m175 75-3 19-16 13-2-26Z" fill="#dcd5c7"/>
    <path d="m172 94 6 15-10 15 2 18-18-11 4-24Z" fill="#eee9dc"/>
    <path d="m170 142-16 10-8 18-11-24 17-15Z" fill="#d9d1c2"/>
    <path d="m146 170-20-1-15 11-1-24 25-10Z" fill="#f8f5e8"/>
    <path d="m111 180-19-7-19 3 7-23 30 3Z" fill="#ddd6c8"/>
    <path d="m73 176-12-13-19-3 17-17 21 10Z" fill="#f8f5e9"/>
    <path d="m42 160-3-18-12-13 20-6 12 20Z" fill="#dfd8ca"/>
    <path d="m27 129 5-19-6-17 21 3v27Z" fill="#f7f4e8"/>
    <path d="m26 93 10-16 1-18 20 14-10 23Z" fill="#e0d8c9"/>
    <path d="m37 59 18-7 9-17 11 3-18 35Z" fill="#fffdf4"/>

    <!-- Broad, uneven paper planes, with small compressed valleys between them. -->
    <path d="m75 38 25-3 4 27-35 5-12 6Z" fill="#eee9dc"/>
    <path d="m100 35 29 8-18 16-7 3Z" fill="#e6dfd0"/>
    <path d="m129 43 10 10-4 18-24-12Z" fill="#fcfaf0"/>
    <path d="m139 53 15 28-19-10Z" fill="#e9e2d4"/>
    <path d="m57 73 12-6 12 19-19 18-15-8Z" fill="#fffdf5"/>
    <path d="m69 67 35-5 7-3-16 31-14-4Z" fill="#e7e0d1"/>
    <path d="m111 59 24 12-16 29-24-10Z" fill="url(#long-fold)"/>
    <path d="m135 71 19 10 2 26-22-2-15-5Z" fill="#fdfbf0"/>
    <path d="m47 96 15 8 10 16-25 3Z" fill="#e2dacb"/>
    <path d="m62 104 19-18 14 4-6 25-17 5Z" fill="#f6f2e6"/>
    <path d="m95 90 24 10-20 7-10 8Z" fill="#d3cab8"/>
    <path d="m119 100 15 5-11 23-24-21Z" fill="#ece5d7"/>
    <path d="m134 105 22 2-4 24-29-3Z" fill="#e4ddce"/>
    <path d="m47 123 25-3-13 23Z" fill="#fdfbf0"/>
    <path d="m72 120 17-5 10-8-3 31-16 15-21-10Z" fill="#f7f3e8"/>
    <path d="m99 107 24 21-13 28-14-18Z" fill="#e1d9c9"/>
    <path d="m123 128 29 3-17 15-25 10Z" fill="#fffdf3"/>
    <path d="m80 153 16-15 14 18-18 17Z" fill="#e7dfcf"/>

    <!-- Soft, folded paper ridges interrupt the broad planes. -->
    <path d="M53 61c8-12 21-14 27-5 4 6 0 16 9 20 8 4 15-3 21-8 8-7 14-7 23-4-12-1-15 5-21 11-8 8-18 15-28 9-11-7-6-19-11-24-5-5-11-2-20 1Z" fill="#d4ccbb" opacity=".58"/>
    <path d="M53 60c9-11 20-13 26-5 5 7 0 17 9 21 9 5 17-5 22-9 8-6 16-5 23-3-11-5-18-4-26 2-9 8-13 11-19 8-5-2-4-12-8-19-7-11-19-7-27 5Z" fill="#fffef5"/>
    <path d="M58 109c9 3 15-2 22-7 9-6 14-2 18 5 4 6 5 14 12 17 7 4 13-1 20-4-7 7-15 11-23 7-9-4-9-14-14-19-5-6-9-2-15 1-8 4-14 6-20 0Z" fill="#cfc6b5" opacity=".58"/>
    <path d="M57 107c9 3 15-1 23-6 8-5 14-2 18 5 4 7 6 14 12 17 7 3 13-1 20-3-9 2-13 3-18 0-7-4-6-12-12-19-5-6-13-8-21-3-8 6-15 9-22 9Z" fill="#fcfaf0"/>
    <path d="M126 78c-5 7-7 14-4 22 2 7 8 11 9 18 1 6-3 13-9 19 9-5 14-12 13-20-1-9-8-13-9-20-1-6 1-12 0-19Z" fill="#c7bdab" opacity=".52"/>
    <path d="M129 77c-6 8-8 15-5 23 3 8 9 12 9 19 0 6-5 13-11 18 9-8 14-16 11-24-3-7-8-10-8-17 0-6 3-12 4-19Z" fill="#fffdf3"/>
    <path d="M62 145c8-7 14-8 20-4 5 4 9 11 15 11 6 1 11-3 14-6-5 7-10 10-16 8-7-1-11-9-16-11-5-2-10-1-17 2Z" fill="#cbc1af" opacity=".4"/>
    <path d="M62 144c8-8 15-8 21-4 5 4 8 10 14 11 5 1 10-2 14-5-8 3-11 5-16 2-5-2-8-8-13-10-7-4-14-1-20 6Z" fill="#fefcf2"/>

    <!-- Two visible turnbacks show a thin sheet, rather than a solid surface. -->
    <path d="M147 47c8 5 13 13 16 23l7 7-11 4c1-13-3-24-12-34Z" fill="#c6bcaa"/>
    <path d="M147 47c8 6 12 14 13 24l9 3-10 5c-1-13-5-23-12-32Z" fill="#fffef8" stroke="#e5dfd1" stroke-width=".7"/>
    <path d="M160 72l9 2-10 5" stroke="#bfb5a2" stroke-width=".8"/>
    <path d="M29 122c9-3 17 0 23 9l-5 13c-5-9-10-13-17-13Z" fill="#c8beab"/>
    <path d="M29 122c10-2 16 2 22 10l-4 9c-6-9-10-13-18-12l8-3Z" fill="#fffef5" stroke="#e5dfd1" stroke-width=".75"/>
    <path d="m29 129 8-3 10 15" stroke="#bfb4a0" stroke-width=".7" opacity=".7"/>

    <!-- Fine, branching creases, intentionally broken rather than a triangle grid. -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="m75 38 4 10-6 9m27-22 4 27 7-3m-54 14 12-6 11 17m31-25-9 17-7 14m40-19-10 15-6 14m35-19-13 7m-94 8 15 8 10 16m17-5 10-8 20-7m-47 20-7 13m31 5 3-20m24 10-13 28m42-25-17 15" stroke="#b9af9a" stroke-width=".8" opacity=".43"/>
      <path d="m79 49-4 8m30 6 3-1m-9 14-7 14m39-17-8 15m-36 29 8-6m10 33 6-14m-41 5-7 7" stroke="#fffef6" stroke-width="1.8" opacity=".9"/>
      <path d="m60 57 3 4-2 9m-7 37 5 6m20-73 5 4m-5 5 8-2m49 52 10-4m-11 49-4-5m-55-8 6 3-3 5m33 27 4-5" stroke="#c5bca9" stroke-width=".65" opacity=".68"/>
      <path d="M43 82q5-3 9 1t9-1m36-40q-3 5 1 8l-1 5m17 32q-6 2-5 7m38 24q-5 1-7 6m-49 32q1-6-4-8m-27-28q4-1 5-5m62 28q-5-1-7 2m-65 3q-2-6-7-6" stroke="#c3b9a5" stroke-width=".7" opacity=".6"/>
      <path d="M44 80q5-2 9 1t8-1m36-39q-2 5 1 8m16 37q-6 2-5 7m36 24q-4 1-6 5m-48 33q0-5-4-8" stroke="#fffef6" stroke-width="1.25" opacity=".9"/>
    </g>

    <!-- A few displaced handwriting fragments remain on the folded sheet. -->
    <g stroke="#85887b" stroke-width="1.15" stroke-linecap="round" opacity=".34">
      <path d="m108 50 5 2m1-4-1 7m5-3 5 3"/>
      <path d="m127 112 4 2m-2-5 3 6m6-2 4 1"/>
      <path d="m66 140 5-2m-3-2 2 6m6-3 5-1"/>
    </g>
    <text x="63" y="95" fill="#85867d" opacity=".35" font-size="13" font-family="KaiTi, STKaiti, cursive" transform="rotate(-12 63 95)">又改</text>
    <path d="M68 136c6-2 10 1 16 0s8-2 13 0m-29 2 28-5" stroke="#8b8b7f" stroke-width="1.1" stroke-linecap="round" opacity=".3"/>
    <use href="#paper" fill="url(#fibers)"/>
  </g>
  <use href="#paper" stroke="#b8af9c" stroke-width="1.15" stroke-linejoin="round"/>
  <path d="m87 24-12 14m25-3 4-19m35 37 21-9m12 50-16 13m-21 39 11 24m-66-17-7 23m-26-53-20 6m30-56-20-14" stroke="#fefcf2" stroke-width="1.1" stroke-linecap="round" opacity=".85"/>
</svg>
